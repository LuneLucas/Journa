<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>状态胶囊 · 错误类别(橙色闪烁)预览</title>
  <!-- 复用项目真实 CSS（不带缓存戳，确保加载到最新改动） -->
  <link rel="stylesheet" href="./css/variables.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components/buttons.css" />
  <link rel="stylesheet" href="./css/components/forms.css" />
  <link rel="stylesheet" href="./css/components/lists.css" />
  <link rel="stylesheet" href="./css/components/modals.css" />
  <link rel="stylesheet" href="./css/components/toast.css" />
  <link rel="stylesheet" href="./css/animations.css" />
  <link rel="stylesheet" href="./css/misc.css" />
  <link rel="stylesheet" href="./css/responsive.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page-bg, #f7f4ef);
      font-family: var(--font-body);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      padding: 48px 20px;
      box-sizing: border-box;
    }
    h1 { font-size: 1.4rem; font-weight: var(--fw-cjk-heavy, 600); margin: 0; }
    .note { font-size: 0.9rem; color: var(--muted); max-width: 560px; text-align: center; line-height: 1.6; }
    .grid {
      display: flex;
      flex-wrap: wrap;
      gap: 22px 28px;
      justify-content: center;
      align-items: center;
      max-width: 760px;
    }
    .cell { display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .cell .tag { font-size: 0.78rem; color: var(--muted); font-weight: var(--fw-bold); }
    .hr { width: min(760px, 92vw); height: 1px; background: var(--border-divider, rgba(0,0,0,0.08)); border: 0; }
  </style>
</head>
<body>
  <h1>状态胶囊 · 新增「错误」类别</h1>
  <p class="note">
    橙色灯 = 云端错误类别（云端不可用 / 链接失效 / 通用同步失败）。<br />
    与红色 <code>is-failed</code>（同步尝试失败）区分开；灯会以 1.1s 节奏警示性闪烁（开启系统动效时）。
  </p>

  <div class="grid">
    <div class="cell">
      <button class="sync-status" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">本地账本</span>
      </button>
      <span class="tag">默认（本地）</span>
    </div>

    <div class="cell">
      <button class="sync-status is-cloud" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">已同步</span>
      </button>
      <span class="tag">is-cloud</span>
    </div>

    <div class="cell">
      <button class="sync-status is-syncing" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">同步中…</span>
      </button>
      <span class="tag">is-syncing（呼吸）</span>
    </div>

    <div class="cell">
      <button class="sync-status is-pending" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">待同步</span>
      </button>
      <span class="tag">is-pending</span>
    </div>

    <div class="cell">
      <button class="sync-status is-failed" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">同步失败</span>
      </button>
      <span class="tag">is-failed（红）</span>
    </div>

    <div class="cell">
      <button class="sync-status is-error" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">云端不可用</span>
      </button>
      <span class="tag">is-error（橙·闪烁）★</span>
    </div>

    <div class="cell">
      <button class="sync-status is-error" type="button" aria-label="同步云账本">
        <span class="sync-status-shell" aria-hidden="true"></span>
        <span class="sync-status-label">链接已失效</span>
      </button>
      <span class="tag">is-error（橙·闪烁）★</span>
    </div>
  </div>

  <hr class="hr" />

  <p class="note">
    ★ 这两个就是本次新增的错误类别：橙色灯 + 1.1s 闪烁。深色模式下同样为橙色（已在 dark.css 平行处理）。<br />
    若系统开启了「减少动态效果」，灯会保持常亮橙色（不闪），仍清晰表示错误。
  </p>
</body>
</html>
