<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Journa · 分摊选择器 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #26352f;
      --muted: #748078;
      --surface: rgba(255, 255, 255, .72);
      --surface-strong: rgba(255, 255, 255, .88);
      --line: rgba(61, 91, 78, .12);
      --green: #668f7c;
      --green-soft: #dcebe2;
      --shadow: 0 22px 60px rgba(52, 78, 66, .13), 0 2px 8px rgba(52, 78, 66, .08);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --radius-md: 15px;
      --radius-pill: 999px;
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 36px 18px;
      background:
        radial-gradient(circle at 18% 0%, rgba(211, 236, 222, .84), transparent 34%),
        linear-gradient(145deg, #f4f7f2, #e8efe9 60%, #f7f6f0);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    }

    .demo-shell { width: min(100%, 460px); margin: 0 auto; }
    .eyebrow { margin: 0 0 8px; color: var(--green); font-size: 12px; font-weight: 800; letter-spacing: .08em; }
    h1 { margin: 0; font-size: clamp(25px, 7vw, 34px); letter-spacing: -.04em; }

    .expense-card {
      border: 1px solid rgba(255, 255, 255, .76);
      border-radius: var(--radius-xl);
      background: var(--surface);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .expense-head { padding: 22px 22px 18px; }
    .amount { font-size: 36px; font-weight: 800; letter-spacing: -.05em; }
    .amount span { margin-right: 3px; color: var(--green); font-size: 22px; }

    .selector { padding: 0 14px 14px; }
    .selector-toggle {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 13px 14px;
      border: 0;
      border-radius: var(--radius-lg);
      background: var(--surface-strong);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px var(--line);
    }
    .selector-toggle:hover { box-shadow: inset 0 0 0 1px rgba(102, 143, 124, .3), 0 8px 24px rgba(75, 113, 94, .1); }
    .toggle-icon { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; background: var(--green-soft); color: var(--green); font-size: 17px; }
    .toggle-copy { min-width: 0; }
    .toggle-copy strong, .toggle-copy span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toggle-copy strong { font-size: 15px; }
    .toggle-copy span { margin-top: 3px; color: var(--muted); font-size: 12px; }
    .chevron { color: var(--green); font-size: 19px; transition: transform .2s ease; }
    .selector.is-open .chevron { transform: rotate(180deg); }

    .panel { display: none; margin-top: 10px; padding: 12px; border-radius: var(--radius-xl); background: rgba(248, 251, 247, .82); box-shadow: inset 0 0 0 1px var(--line); }
    .selector.is-open .panel { display: block; animation: rise .22s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

    .section-label { margin: 3px 3px 9px; color: var(--muted); font-size: 12px; font-weight: 800; }
    .rule-toggle { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: var(--radius-md); background: rgba(224, 235, 226, .72); }
    .quick-option, .mode-option, .family-option { border: 0; cursor: pointer; font: inherit; }
    .quick-option { min-height: 46px; padding: 8px 10px; border-radius: 11px; background: transparent; color: var(--muted); text-align: left; transition: background .2s ease, color .2s ease, box-shadow .2s ease; }
    .quick-option strong { display: block; }
    .quick-option strong { font-size: 13px; }
    .quick-option.is-active { background: rgba(255, 255, 255, .92); color: var(--ink); box-shadow: 0 4px 12px rgba(65, 99, 79, .09), inset 0 0 0 1px rgba(255, 255, 255, .82); }

    .advanced { margin-top: 14px; padding-top: 13px; border-top: 1px solid var(--line); }
    .mode-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .mode-option { padding: 10px 8px; border-radius: var(--radius-md); background: transparent; color: var(--muted); font-size: 13px; font-weight: 750; }
    .mode-option.is-active { background: rgba(255, 255, 255, .9); color: var(--green); box-shadow: inset 0 0 0 1px var(--line); }
    .family-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
    .family-option { min-height: 43px; padding: 0 5px; border-radius: var(--radius-pill); background: #fff; color: var(--family); font-size: 13px; font-weight: 750; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--family) 23%, transparent); }
    .family-option.is-active { background: color-mix(in srgb, var(--family) 22%, white); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--family) 56%, transparent); }
    .custom-note { margin: 10px 2px 2px; padding: 10px 12px; border-radius: var(--radius-md); background: #fff; color: var(--muted); font-size: 12px; line-height: 1.5; }

    .rule-preview { display: none; }
    .demo-foot { display: none; }
    @media (max-width: 360px) { body { padding-inline: 12px; } .expense-head { padding-inline: 18px; } .selector { padding-inline: 10px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="demo-shell">
    <p class="eyebrow">JOURNA · SPLIT SELECTOR</p>
    <h1>分摊</h1>

    <section class="expense-card" aria-label="分摊选择器演示">
      <div class="expense-head">
        <div class="amount"><span>¥</span>268.50</div>
      </div>
      <div class="selector" id="selector">
        <button class="selector-toggle" id="toggle" type="button" aria-expanded="false">
          <span class="toggle-icon" aria-hidden="true">÷</span>
          <span class="toggle-copy"><strong id="summary">3 家均分</strong></span>
          <span class="chevron" aria-hidden="true">⌄</span>
        </button>

        <div class="panel" id="panel">
          <div class="advanced">
            <div class="section-label">更多方式</div>
            <div class="mode-row" role="tablist" aria-label="其他分摊方式">
              <button class="mode-option" data-mode="families" type="button">指定参与家庭</button>
              <button class="mode-option" data-mode="custom" type="button">自定金额</button>
            </div>
            <div class="family-list" id="familyList" hidden>
              <button class="family-option is-active" style="--family:#7eab98" data-family="旦家" type="button">旦家</button>
              <button class="family-option is-active" style="--family:#849fcd" data-family="乐家" type="button">乐家</button>
              <button class="family-option is-active" style="--family:#c88f8d" data-family="祺家" type="button">祺家</button>
            </div>
            <div class="section-label rule-label">分摊规则</div>
            <div class="rule-toggle" role="tablist" aria-label="分摊规则">
              <button class="quick-option is-active" data-quick="equal-all" type="button"><strong>均分</strong></button>
              <button class="quick-option" data-quick="people-all" type="button"><strong>按人数</strong></button>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <script>
    const selector = document.querySelector('#selector');
    const toggle = document.querySelector('#toggle');
    const summary = document.querySelector('#summary');
    const familyList = document.querySelector('#familyList');
    const familyButtons = [...document.querySelectorAll('[data-family]')];

    toggle.addEventListener('click', () => {
      const open = !selector.classList.contains('is-open');
      selector.classList.toggle('is-open', open);
      toggle.setAttribute('aria-expanded', String(open));
    });

    function resetQuick() { document.querySelectorAll('[data-quick]').forEach((button) => button.classList.remove('is-active')); }
    function resetModes() { document.querySelectorAll('[data-mode]').forEach((button) => button.classList.remove('is-active')); }
    function setState(state) {
      const keepFamilies = (state === 'equal-all' || state === 'people-all')
        && document.querySelector('[data-mode="families"]').classList.contains('is-active');
      resetQuick(); resetModes(); familyList.hidden = !keepFamilies;
      if (keepFamilies) document.querySelector('[data-mode="families"]').classList.add('is-active');
      if (state === 'equal-all') {
        document.querySelector('[data-quick="equal-all"]').classList.add('is-active');
        const selected = familyButtons.filter((item) => item.classList.contains('is-active')).map((item) => item.dataset.family);
        summary.textContent = `${selected.length} 家均分`;
      } else if (state === 'people-all') {
        document.querySelector('[data-quick="people-all"]').classList.add('is-active');
        const selected = familyButtons.filter((item) => item.classList.contains('is-active')).map((item) => item.dataset.family);
        summary.textContent = `${selected.length} 家按人数`;
      } else if (state === 'families') {
        document.querySelector('[data-mode="families"]').classList.add('is-active'); familyList.hidden = false;
        summary.textContent = '指定参与家庭';
      } else {
        document.querySelector('[data-mode="custom"]').classList.add('is-active');
        summary.textContent = '自定金额';
      }
    }

    document.querySelectorAll('[data-quick]').forEach((button) => button.addEventListener('click', () => setState(button.dataset.quick)));
    document.querySelector('[data-mode="families"]').addEventListener('click', () => setState('families'));
    document.querySelector('[data-mode="custom"]').addEventListener('click', () => setState('custom'));
    familyButtons.forEach((button) => button.addEventListener('click', () => {
      button.classList.toggle('is-active');
      const selected = familyButtons.filter((item) => item.classList.contains('is-active')).map((item) => item.dataset.family);
      summary.textContent = `${selected.length} 家均分`;
    }));
  </script>
</body>
</html>
