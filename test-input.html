<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body {
    background: #333;
    color: white;
    padding: 50px;
    font-family: sans-serif;
  }
  .input-min-height {
    font-size: 35px;
    min-height: 68px;
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 100%;
    margin-bottom: 20px;
  }
  .input-height {
    font-size: 35px;
    height: 68px;
    border-radius: 12px;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    width: 100%;
  }
</style>
</head>
<body>
  <p>min-height: 68px</p>
  <input class="input-min-height" type="text" value="759">
  <p>height: 68px</p>
  <input class="input-height" type="text" value="759">
</body>
</html>
