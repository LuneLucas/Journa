<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>移动端「添加类别」圆形 + 按钮 Demo</title>
<style>
  :root {
    --settle: cubic-bezier(0.16, 0.9, 0.14, 1);
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --motion-fast: 160ms;
    --radius-md: 12px;
    --radius-pill: 999px;
    --bg: #f7f4ef;
    --ink: #3a352f;
    --muted: #8a8278;
    --line: rgba(58, 53, 47, 0.12);
    --theme-color: #a9ceb5;
    --theme-color-strong: #4f9b78;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px;
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 420px; margin: 0 auto; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  p.sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }

  /* —— 复刻 app 里的 .category-picker 结构 —— */
  fieldset.category-picker {
    border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 14px; margin: 0; background: #fff;
  }
  fieldset.category-picker legend { padding: 0 6px; color: var(--muted); font-size: 13px; }
  .category-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .selectable-category-chip {
    border: 1px solid var(--line); background: #faf8f4; color: var(--ink);
    border-radius: 999px; padding: 8px 14px; font-size: 14px; cursor: pointer;
  }
  .selectable-category-chip[aria-checked="true"] {
    background: var(--theme-color); border-color: transparent; color: #1f2a23;
  }

  /* —— 圆形 + 按钮 与 新增表单 同一行 —— */
  .category-add-area {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
  }
  .category-add-fab {
    flex: 0 0 auto;
    width: 44px;
    height: 44px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    border-radius: var(--radius-pill);
    border: 1px dashed color-mix(in oklch, var(--theme-color) 42%, var(--line));
    background: color-mix(in oklch, var(--theme-color) 7%, transparent);
    color: color-mix(in oklch, var(--theme-color-strong) 88%, var(--ink));
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition:
      transform var(--motion-fast) var(--spring),
      border-color var(--motion-fast) var(--spring),
      background-color var(--motion-fast) var(--spring);
  }
  .category-add-fab:active { transform: scale(0.94); }
  .category-add-fab-icon {
    position: relative;
    width: 16px; height: 16px;
    display: inline-block;
    transition: transform var(--motion-fast) var(--spring);
  }
  .category-add-fab-icon::before,
  .category-add-fab-icon::after {
    content: "";
    position: absolute;
    background: currentColor;
    border-radius: 1.5px;
  }
  .category-add-fab-icon::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
  .category-add-fab-icon::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
  .category-picker.is-adding .category-add-fab-icon { transform: rotate(45deg); }

  /* —— 这里是本次新增的展开/收起动画（与 css/responsive.css 中一致） —— */
  .category-add-area .inline-category-form {
    flex: 1 1 auto;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    max-height: 0;
    margin-top: 0;
    opacity: 0;
    overflow: hidden;
    transform: translateY(-4px);
    pointer-events: none;
    transition: max-height 420ms var(--settle),
                opacity 420ms var(--settle),
                margin-top 420ms var(--settle),
                transform 420ms var(--settle);
  }
  .category-picker.is-adding .inline-category-form {
    max-height: 96px;
    margin-top: 4px;
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
  .inline-category-form input {
    flex: 1 1 120px; min-width: 0; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; font-size: 14px;
  }
  .inline-category-form .secondary-button {
    border: 1px solid var(--line); background: #fff; border-radius: 10px;
    padding: 10px 16px; font-size: 14px; cursor: pointer;
  }

  .hint { margin-top: 18px; font-size: 12px; color: var(--muted); }
  .toggle-compare { margin-top: 8px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  /* 对比：关掉动画，回到原来的 display 硬切换 */
  .no-anim .category-add-area .inline-category-form {
    transition: none; max-height: none; opacity: 1; transform: none; overflow: visible;
  }
  .no-anim .category-picker:not(.is-adding) .inline-category-form { display: none; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>移动端「添加类别」圆形 + 按钮</h1>
    <p class="sub">点圆形 + 按钮，表单在同一行平滑展开；再次点 +（已转 ×）收起。</p>

    <fieldset class="category-picker" id="picker">
      <legend>类别</legend>
      <div class="category-chips" role="radiogroup" aria-label="选择类别">
        <button class="selectable-category-chip" type="button" aria-checked="false">餐饮</button>
        <button class="selectable-category-chip" type="button" aria-checked="false">交通</button>
        <button class="selectable-category-chip" type="button" aria-checked="false">住宿</button>
      </div>
      <div class="category-add-area">
        <button class="category-add-fab" id="addFab" type="button" aria-label="新增类别" aria-expanded="false">
          <span class="category-add-fab-icon" aria-hidden="true"></span>
        </button>
        <div class="category-form inline-category-form" aria-label="新增类别">
          <input id="newCategoryInput" type="text" maxlength="12" placeholder="新增类别" />
          <button class="secondary-button" type="button">添加</button>
        </div>
      </div>
    </fieldset>

    <label class="toggle-compare">
      <input type="checkbox" id="compare" /> 对比：关闭动画（原 display 硬切换）
    </label>

    <p class="hint">在手机视口（或浏览器开发者工具的移动模拟）下打开本页效果最佳。</p>
  </div>

<script>
  const picker = document.getElementById('picker');
  const addFab = document.getElementById('addFab');
  const input = document.getElementById('newCategoryInput');
  const compare = document.getElementById('compare');

  addFab.addEventListener('click', () => {
    const adding = picker.classList.toggle('is-adding');
    addFab.setAttribute('aria-expanded', String(adding));
    if (adding) input.focus();
  });

  compare.addEventListener('change', () => {
    document.body.classList.toggle('no-anim', compare.checked);
  });
</script>
</body>
</html>
