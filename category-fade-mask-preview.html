<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>类别横滑两端遮罩 — Before / After 对比</title>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/misc.css" />
<link rel="stylesheet" href="css/components/forms.css" />
<link rel="stylesheet" href="css/components/buttons.css" />
<link rel="stylesheet" href="css/responsive.css" />
<link rel="stylesheet" href="css/dark.css" />
<style>
  body { padding: 24px 16px 60px; background: var(--bg); color: var(--ink); }
  .row { max-width: 390px; margin: 0 auto 24px; }
  .stage {
    padding: 18px 18px 20px;
    border-radius: var(--radius-xl);
    background: var(--bg-elev, var(--surface));
    box-shadow: 0 1px 0 rgba(255,255,255,0.4) inset, 0 12px 30px -18px rgba(0,0,0,0.18);
    margin-bottom: 18px;
  }
  .stage h2 {
    margin: 0 0 12px;
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 500;
  }
  .tag.before { background: rgba(220, 120, 110, 0.18); color: #8b3a30; }
  .tag.after  { background: rgba(79, 155, 120, 0.18); color: #2f6b50; }
  fieldset.category-picker {
    border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 14px; margin: 0; background: var(--surface-soft, #fff);
  }
  fieldset.category-picker legend { padding: 0 6px; color: var(--muted); font-size: 13px; }
  .selectable-category-chip { flex: 0 0 auto; }

  /* BEFORE：还原旧版 72px 椭圆径向渐隐、right:-4px、top/bottom ±8px */
  .stage.before-mode .category-control-row::after {
    display: none !important;
  }
  .stage.before-mode .category-chips-fade::after {
    left: auto !important;
    right: -4px !important;
    top: -8px !important;
    bottom: -8px !important;
    width: 72px !important;
    border-radius: var(--radius-pill) !important;
    background: radial-gradient(
      ellipse at 100% 50%,
      var(--cat-fade-color) 0%,
      color-mix(in srgb, var(--cat-fade-color) 72%, transparent) 44%,
      transparent 100%
    ) !important;
    filter: blur(3px) !important;
  }
  .stage.before-mode .category-chips-fade::before {
    top: 0 !important;
    bottom: 0 !important;
  }
  /* AFTER 已是默认（由 responsive.css 提供）；无需覆盖 */
</style>
</head>
<body class="theme-clay">
<div class="row">
  <h1 style="font-size:14px;color:var(--muted);margin:0 0 14px;font-weight:600;text-align:center;">浅色模式（theme-clay）</h1>
  <div class="stage before-mode">
    <h2>类别横滑遮罩 <span class="tag before">BEFORE</span></h2>
    <fieldset class="category-picker">
      <legend>类别</legend>
      <div class="category-control-row can-fade-start can-fade-end">
        <div class="category-chips-fade can-fade-start can-fade-end">
          <div class="selectable-category-chips" role="radiogroup" aria-label="选择类别">
            <button class="selectable-category-chip" type="button"><span>交通</span></button>
            <button class="selectable-category-chip" type="button"><span>住宿</span></button>
            <button class="selectable-category-chip is-selected" type="button"><span>餐饮</span></button>
            <button class="selectable-category-chip" type="button"><span>门票</span></button>
            <button class="selectable-category-chip" type="button"><span>购物</span></button>
            <button class="selectable-category-chip" type="button"><span>机票</span></button>
            <button class="selectable-category-chip" type="button"><span>杂项</span></button>
          </div>
        </div>
        <div class="category-form inline-category-form category-add-control">
          <button class="category-add-fab" type="button" aria-label="新增类别">
            <span class="category-add-fab-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </fieldset>
  </div>

  <div class="stage">
    <h2>类别横滑遮罩 <span class="tag after">AFTER</span></h2>
    <fieldset class="category-picker">
      <legend>类别</legend>
      <div class="category-control-row can-fade-start can-fade-end">
        <div class="category-chips-fade can-fade-start can-fade-end">
          <div class="selectable-category-chips" role="radiogroup" aria-label="选择类别">
            <button class="selectable-category-chip" type="button"><span>交通</span></button>
            <button class="selectable-category-chip" type="button"><span>住宿</span></button>
            <button class="selectable-category-chip is-selected" type="button"><span>餐饮</span></button>
            <button class="selectable-category-chip" type="button"><span>门票</span></button>
            <button class="selectable-category-chip" type="button"><span>购物</span></button>
            <button class="selectable-category-chip" type="button"><span>机票</span></button>
            <button class="selectable-category-chip" type="button"><span>杂项</span></button>
          </div>
        </div>
        <div class="category-form inline-category-form category-add-control">
          <button class="category-add-fab" type="button" aria-label="新增类别">
            <span class="category-add-fab-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </fieldset>
  </div>
</div>

<div class="row">
  <h1 style="font-size:14px;color:var(--muted);margin:0 0 14px;font-weight:600;text-align:center;">深色模式（theme-clay + dark）</h1>
  <div class="stage before-mode dark-mode">
    <h2>类别横滑遮罩 <span class="tag before">BEFORE</span></h2>
    <fieldset class="category-picker">
      <legend>类别</legend>
      <div class="category-control-row can-fade-start can-fade-end">
        <div class="category-chips-fade can-fade-start can-fade-end">
          <div class="selectable-category-chips" role="radiogroup" aria-label="选择类别">
            <button class="selectable-category-chip" type="button"><span>交通</span></button>
            <button class="selectable-category-chip" type="button"><span>住宿</span></button>
            <button class="selectable-category-chip is-selected" type="button"><span>餐饮</span></button>
            <button class="selectable-category-chip" type="button"><span>门票</span></button>
            <button class="selectable-category-chip" type="button"><span>购物</span></button>
            <button class="selectable-category-chip" type="button"><span>机票</span></button>
            <button class="selectable-category-chip" type="button"><span>杂项</span></button>
          </div>
        </div>
        <div class="category-form inline-category-form category-add-control">
          <button class="category-add-fab" type="button" aria-label="新增类别">
            <span class="category-add-fab-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </fieldset>
  </div>

  <div class="stage dark-mode">
    <h2>类别横滑遮罩 <span class="tag after">AFTER</span></h2>
    <fieldset class="category-picker">
      <legend>类别</legend>
      <div class="category-control-row can-fade-start can-fade-end">
        <div class="category-chips-fade can-fade-start can-fade-end">
          <div class="selectable-category-chips" role="radiogroup" aria-label="选择类别">
            <button class="selectable-category-chip" type="button"><span>交通</span></button>
            <button class="selectable-category-chip" type="button"><span>住宿</span></button>
            <button class="selectable-category-chip is-selected" type="button"><span>餐饮</span></button>
            <button class="selectable-category-chip" type="button"><span>门票</span></button>
            <button class="selectable-category-chip" type="button"><span>购物</span></button>
            <button class="selectable-category-chip" type="button"><span>机票</span></button>
            <button class="selectable-category-chip" type="button"><span>杂项</span></button>
          </div>
        </div>
        <div class="category-form inline-category-form category-add-control">
          <button class="category-add-fab" type="button" aria-label="新增类别">
            <span class="category-add-fab-icon" aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </fieldset>
  </div>
</div>
</body>
</html>
